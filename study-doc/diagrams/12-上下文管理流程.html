<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上下文管理流程</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --ok: #bbf7d0;
    --info: #e0e7ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --ok: #166534;
      --info: #3730a3;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .mono { font-family: ui-monospace, monospace; font-size: 11px; }
  .node { stroke: var(--line); stroke-width: 1; rx: 6; ry: 6; }
  .pill { stroke: var(--line); stroke-width: 1; rx: 14; ry: 14; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .ok { fill: var(--ok); }
  .info { fill: var(--info); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .edgeThick { stroke: var(--line); stroke-width: 2.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
  .arrow { fill: var(--line); }
</style>
<main>
  <svg viewBox="0 0 1100 1500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
      </marker>
      <marker id="arrowDash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
      </marker>
    </defs>

    <!-- Title -->
    <text x="550" y="32" text-anchor="middle" class="title">OpenClaw 上下文管理流程</text>

    <!-- ============================================================ -->
    <!-- 泳道：Layer -->
    <!-- ============================================================ -->

    <!-- 泳道 A: 系统提示组装 -->
    <rect x="40" y="55" width="1020" height="205" class="zone" />
    <text x="55" y="75" class="small">Layer A: 系统提示组装</text>

    <!-- 稳定区块 -->
    <rect x="60" y="90" width="440" height="72" class="node neutral" />
    <text x="280" y="115" text-anchor="middle" class="label">稳定区（Cacheable）</text>
    <text x="280" y="133" text-anchor="middle" class="small">SOUL.md · AGENTS.md · MEMORY.md</text>
    <text x="280" y="148" text-anchor="middle" class="small">工具列表 · 角色定义 · 使用规则</text>

    <rect x="60" y="90" width="440" height="72" class="node neutral" opacity="0.3" />
    <rect x="60" y="90" width="440" height="72" rx="6" ry="6" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6" stroke-dasharray="5 3" />

    <!-- 缓存边界标记 -->
    <rect x="60" y="172" width="440" height="22" fill="#fde047" rx="3" ry="3" opacity="0.4" />
    <text x="280" y="187" text-anchor="middle" class="mono" fill="#ca8a04">&lt;!-- OPENCLAW_CACHE_BOUNDARY --&gt;</text>

    <!-- 动态区块 -->
    <rect x="60" y="200" width="440" height="50" class="node info" />
    <text x="280" y="220" text-anchor="middle" class="label">动态区（非缓存）</text>
    <text x="280" y="238" text-anchor="middle" class="small">memory/YYYY-MM-DD.md · 频道指令 · 实时状态</text>

    <!-- 右侧：Context 文件排序 -->
    <rect x="560" y="90" width="200" height="160" class="node storage" />
    <text x="660" y="110" text-anchor="middle" class="label">context 文件加载策略</text>
    <text x="660" y="132" text-anchor="middle" class="small" font-size="10">sortContextFilesForPrompt()</text>
    <text x="570" y="152" class="mono" font-size="10">stable files (memory.md)</text>
    <text x="570" y="172" class="mono" font-size="10">  → 缓存边界之前</text>
    <text x="570" y="192" class="mono" font-size="10">dynamic files (daily)</text>
    <text x="570" y="212" class="mono" font-size="10">  → 缓存边界之后</text>
    <text x="570" y="236" class="mono" font-size="10">最大化 cache 命中范围</text>

    <!-- 右侧：Anthropic 缓存控制 -->
    <rect x="820" y="90" width="220" height="160" class="node process" />
    <text x="930" y="110" text-anchor="middle" class="label">Anthropic Prompt Cache</text>
    <text x="830" y="132" class="mono" font-size="10">稳定区 → cache_control: ephemeral</text>
    <text x="830" y="152" class="mono" font-size="10">TTL: 5min（short）</text>
    <text x="830" y="172" class="mono" font-size="10">     1h（long, api.anthropic.com）</text>
    <text x="830" y="196" class="mono" font-size="10">同理：最后一条 user msg</text>
    <text x="830" y="216" class="mono" font-size="10">也打 cache_control</text>

    <!-- 箭头：排序 → 稳定区 -->
    <line x1="760" y1="170" x2="505" y2="126" class="edge" marker-end="url(#arrow)" />

    <!-- ============================================================ -->
    <!-- 泳道 B: 主流程 - Turn 前维护 -->
    <!-- ============================================================ -->

    <rect x="40" y="275" width="1020" height="180" class="zone" />
    <text x="55" y="295" class="small">Layer B: Turn 前 → 溢出预检 → 路由决策</text>

    <!-- 1. context-engine maintain -->
    <rect x="100" y="310" width="220" height="60" class="node input" />
    <text x="210" y="338" text-anchor="middle" class="label">① context-engine maintain()</text>
    <text x="210" y="355" text-anchor="middle" class="small">turn 前维护（foreground 或 deferred）</text>

    <!-- 2. overflow precheck -->
    <rect x="400" y="310" width="260" height="60" class="node risk" />
    <text x="530" y="335" text-anchor="middle" class="label">② 溢出预检（Estimated 溢出检查）</text>
    <text x="530" y="355" text-anchor="middle" class="small">估计 prompt tokens × 安全系数 1.2</text>

    <!-- 3. 路由决策 -->
    <rect x="740" y="310" width="280" height="60" class="node process" />
    <text x="880" y="335" text-anchor="middle" class="label">③ 路由决策（Routings）</text>
    <text x="880" y="355" text-anchor="middle" class="small">预算: max(8k, contextWindow × 50%)</text>

    <!-- 箭头 -->
    <line x1="320" y1="340" x2="395" y2="340" class="edge" marker-end="url(#arrow)" />
    <line x1="660" y1="340" x2="735" y2="340" class="edge" marker-end="url(#arrow)" />

    <!-- 三条分支 -->
    <!-- fits -->
    <rect x="100" y="400" width="220" height="40" class="node ok" />
    <text x="210" y="425" text-anchor="middle" class="label">🟢 fits — 直接发送</text>

    <!-- truncate -->
    <rect x="400" y="400" width="260" height="40" class="node info" />
    <text x="530" y="425" text-anchor="middle" class="label">🟡 truncate — 截断 tool result 后发送</text>

    <!-- compact -->
    <rect x="740" y="400" width="280" height="40" class="node external" />
    <text x="880" y="425" text-anchor="middle" class="label">🔴 compact — 执行压缩后再发送</text>

    <!-- 分支线 -->
    <line x1="740" y1="370" x2="740" y2="395" class="edge" marker-end="url(#arrow)" />
    <line x1="400" y1="370" x2="400" y2="395" class="edge" marker-end="url(#arrow)" />
    <line x1="100" y1="370" x2="100" y2="395" class="edge" marker-end="url(#arrow)" />

    <!-- 路由判断文字 -->
    <text x="530" y="388" text-anchor="middle" class="mono" font-size="10">overflow &gt; 0 → 非 fits</text>

    <!-- ============================================================ -->
    <!-- Layer C: 压缩管道 -->
    <!-- ============================================================ -->

    <rect x="40" y="470" width="1020" height="490" class="zone" />
    <text x="55" y="490" class="small">Layer C: 压缩管道（Compaction Pipeline）</text>

    <!-- summarizeInStages -->
    <rect x="80" y="505" width="280" height="50" class="node process" />
    <text x="220" y="530" text-anchor="middle" class="label">summarizeInStages()</text>
    <text x="220" y="545" text-anchor="middle" class="small">压缩入口，按上下文估算 token</text>

    <!-- 判断分支 -->
    <text x="450" y="530" class="mono" font-size="11">token 不超限？</text>
    <line x1="360" y1="530" x2="420" y2="530" class="edge" marker-end="url(#arrow)" />

    <!-- 不超限分支 -->
    <rect x="500" y="505" width="240" height="50" class="node ok" />
    <text x="620" y="528" text-anchor="middle" class="label">summarizeWithFallback()</text>
    <text x="620" y="545" text-anchor="middle" class="small">直接摘要，渐进 fallback</text>

    <line x1="740" y1="530" x2="780" y2="530" class="edge" marker-end="url(#arrow)" />

    <!-- 超限分支 -->
    <rect x="80" y="575" width="940" height="70" class="node neutral" />
    <text x="550" y="598" text-anchor="middle" class="label">splitMessagesByTokenShare() — 按 token 份额切片</text>
    <text x="550" y="618" text-anchor="middle" class="small">每片独立摘要 → 合并摘要（merge）</text>
    <text x="550" y="635" text-anchor="middle" class="small">每片重试 3 次（指数退避 500ms～5000ms）</text>

    <line x1="220" y1="555" x2="220" y2="572" class="edge" marker-end="url(#arrow)" />

    <!-- 摘要 prompt → 强制保留清单 -->
    <rect x="80" y="665" width="300" height="85" class="node input" />
    <text x="230" y="685" text-anchor="middle" class="label">摘要 Prompt 强制保留</text>
    <text x="90" y="705" class="mono" font-size="10">✓ 进行中的任务 &amp; 状态</text>
    <text x="90" y="720" class="mono" font-size="10">✓ 批量操作进度（5/17）</text>
    <text x="90" y="735" class="mono" font-size="10">✓ 决策 &amp; TODO &amp; 限制条件</text>

    <rect x="420" y="665" width="300" height="85" class="node risk" />
    <text x="570" y="685" text-anchor="middle" class="label">标识符保护（Identifier Policy）</text>
    <text x="430" y="705" class="mono" font-size="10">✓ UUIDs / 哈希 / IDs</text>
    <text x="430" y="720" class="mono" font-size="10">✓ 主机名 / IPs / 端口</text>
    <text x="430" y="735" class="mono" font-size="10">✓ URLs / 文件名 — 原样保留</text>

    <rect x="760" y="665" width="260" height="85" class="node storage" />
    <text x="890" y="685" text-anchor="middle" class="label">previousSummary 连续性</text>
    <text x="770" y="708" class="mono" font-size="10">上一次摘要作为输入</text>
    <text x="770" y="728" class="mono" font-size="10">滚动积累，不丢失以前的内容</text>

    <!-- 箭头 -->
    <line x1="550" y1="645" x2="550" y2="662" class="edge" marker-end="url(#arrow)" />

    <!-- Fallback 链 -->
    <rect x="80" y="770" width="940" height="60" class="node neutral" />
    <text x="550" y="793" text-anchor="middle" class="label">📉 渐进式 Fallback 链</text>
    <text x="550" y="813" text-anchor="middle" class="mono" font-size="10">
      summarizeChunks() → 过滤超大消息（单条 &gt; 50%） → 重试摘要 → 记录 partialSummary → 最终: "N 条消息, M 条过大. Summary unavailable."
    </text>

    <!-- 模型 handoff 特殊压缩 -->
    <rect x="80" y="850" width="460" height="50" class="node external" />
    <text x="310" y="873" text-anchor="middle" class="label">模型切换时 → summarizeForHandoff()</text>
    <text x="310" y="890" text-anchor="middle" class="small">上限 4000 tokens · 子代理角色区分</text>

    <!-- pruneHistoryForContextShare -->
    <rect x="600" y="850" width="420" height="50" class="node input" />
    <text x="810" y="873" text-anchor="middle" class="label">pruneHistoryForContextShare()</text>
    <text x="810" y="890" text-anchor="middle" class="small">share 模式 ≤ 50% · handoff 模式 ≤ 20%</text>

    <!-- ============================================================ -->
    <!-- Layer D: 图片剪枝 + 微压缩 -->
    <!-- ============================================================ -->

    <rect x="40" y="975" width="1020" height="155" class="zone" />
    <text x="55" y="995" class="small">Layer D: 图片剪枝 + 微压缩（in-memory，不写磁盘）</text>

    <!-- 图片剪枝 -->
    <rect x="80" y="1010" width="440" height="100" class="node risk" />
    <text x="300" y="1035" text-anchor="middle" class="label">🖼️ 图片历史剪枝（history-image-prune.ts）</text>
    <text x="90" y="1058" class="mono" font-size="10">保留最近 PRESERVE_RECENT_COMPLETED_TURNS = 3 轮</text>
    <text x="90" y="1078" class="mono" font-size="10">旧图片 → "[image data removed - already processed]"</text>
    <text x="90" y="1098" class="mono" font-size="10">旧媒体引用 → "[media reference removed ...]"</text>

    <!-- 微压缩 -->
    <rect x="580" y="1010" width="440" height="100" class="node process" />
    <text x="800" y="1035" text-anchor="middle" class="label">🔧 微压缩（context-pruning/pruner.ts）</text>
    <text x="590" y="1058" class="mono" font-size="10">tool result 截断（estimateToolResultReductionPotential）</text>
    <text x="590" y="1078" class="mono" font-size="10">thinking 块裁剪（dropThinkingBlocks）</text>
    <text x="590" y="1098" class="mono" font-size="10">图片块降级为占位符</text>

    <!-- ============================================================ -->
    <!-- Layer E: LLM 调用 + Turn 完成 -->
    <!-- ============================================================ -->

    <rect x="40" y="1145" width="1020" height="190" class="zone" />
    <text x="55" y="1165" class="small">Layer E: LLM 调用 → Turn 完成 → 后台维护</text>

    <!-- 合并系统提示 + 历史 + 当前 -->
    <rect x="80" y="1180" width="400" height="60" class="node input" />
    <text x="280" y="1205" text-anchor="middle" class="label">组装最终 Prompt</text>
    <text x="280" y="1223" text-anchor="middle" class="small">稳定区（已截断） | 历史消息（已裁剪） | 当前</text>

    <line x1="480" y1="1210" x2="550" y2="1210" class="edge" marker-end="url(#arrow)" />

    <!-- LLM -->
    <rect x="560" y="1180" width="200" height="60" class="node process" />
    <text x="660" y="1208" text-anchor="middle" class="label">🚀 发往 LLM</text>
    <text x="660" y="1225" text-anchor="middle" class="small">收到回复</text>

    <line x1="760" y1="1210" x2="830" y2="1210" class="edge" marker-end="url(#arrow)" />

    <!-- before-tool-call -->
    <rect x="840" y="1180" width="200" height="60" class="node risk" />
    <text x="940" y="1205" text-anchor="middle" class="label">🔍 before-tool-call 检查</text>
    <text x="940" y="1223" text-anchor="middle" class="small">名称 · schema · 权限</text>

    <!-- Turn 完成 -->
    <rect x="80" y="1260" width="460" height="60" class="node ok" />
    <text x="310" y="1283" text-anchor="middle" class="label">✅ Turn 完成</text>
    <text x="310" y="1300" text-anchor="middle" class="small">AI 回复已发送给用户</text>

    <!-- 后台维护 -->
    <rect x="620" y="1260" width="420" height="60" class="node storage" />
    <text x="830" y="1283" text-anchor="middle" class="label">⏳ context-engine deferred maintenance</text>
    <text x="830" y="1300" text-anchor="middle" class="small">异步：更新 transcript · 释放内存</text>

    <line x1="310" y1="1240" x2="310" y2="1257" class="edge" marker-end="url(#arrow)" />
    <line x1="940" y1="1240" x2="940" y2="1255" stroke-dasharray="5 3" class="edge" marker-end="url(#arrow)" />
    <line x1="940" y1="1255" x2="830" y2="1257" class="edge" stroke-dasharray="5 3" marker-end="url(#arrow)" />
    <text x="945" y="1295" class="mono" font-size="10">← deferred</text>

  </svg>
</main>
